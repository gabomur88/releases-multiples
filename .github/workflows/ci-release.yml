name: CI Multi Modulo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:

  # =========================================================
  # JOB 1: COMPILAR, TESTEAR Y PROBAR INTEGRACION A -> B -> C
  # =========================================================
  build-test:
    runs-on: ubuntu-24.04

    steps:

      # 1. Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v6

      # 2. Configurar Java
      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 3. Compilar todos los modulos y ejecutar tests
      - name: Compilar y ejecutar tests
        run: mvn clean package

      # 4. Arrancar Modulo A
      - name: Arrancar Modulo A
        run: |
          nohup java -jar moduloa/target/moduloa-0.0.1-SNAPSHOT.jar > moduloa.log 2>&1 &

      # 5. Esperar Modulo A
      - name: Esperar Modulo A
        run: |
          for i in {1..30}; do
            if curl -fSs http://localhost:8081/saludo; then
              echo ""
              echo "Modulo A esta disponible"
              break
            fi

            echo "Esperando Modulo A..."
            sleep 2
          done

          curl -fSs http://localhost:8081/saludo

      # 6. Arrancar Modulo B
      - name: Arrancar Modulo B
        run: |
          nohup java -jar modulob/target/modulob-0.0.1-SNAPSHOT.jar > modulob.log 2>&1 &

      # 7. Probar integracion B -> A
      - name: Probar integracion B con A
        run: |
          for i in {1..30}; do
            if curl -fSs http://localhost:8082/consume-a; then
              echo ""
              echo "Modulo B esta disponible y pudo consumir Modulo A"
              break
            fi

            echo "Esperando Modulo B..."
            sleep 2
          done

          curl -fSs http://localhost:8082/consume-a

      # 8. Arrancar Modulo C
      - name: Arrancar Modulo C
        run: |
          nohup java -jar moduloc/target/moduloc-0.0.1-SNAPSHOT.jar > moduloc.log 2>&1 &

      # 9. Probar integracion C -> B -> A
      - name: Probar integracion C con B y A
        run: |
          for i in {1..30}; do
            if curl -fSs http://localhost:8083/cintegracion; then
              echo ""
              echo "Integracion C -> B -> A funcionando"
              break
            fi

            echo "Esperando Modulo C..."
            sleep 2
          done

          curl -fSs http://localhost:8083/cintegracion

      # 10. Guardar los JAR como artifact
      - name: Guardar JARs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-modulos
          path: |
            moduloa/target/*.jar
            modulob/target/*.jar
            moduloc/target/*.jar


  # =========================================================
  # JOB 2: DESCARGAR Y VERIFICAR EL ARTIFACT
  # =========================================================
  verificar-artifact:
    needs: build-test
    runs-on: ubuntu-24.04

    steps:

      - name: Descargar JARs
        uses: actions/download-artifact@v4
        with:
          name: springboot-modulos
          path: ./ejecutables

      - name: Mostrar JARs descargados
        run: find ./ejecutables -type f -name "*.jar"


  # =========================================================
  # JOB 3: CREAR RELEASE SOLO CUANDO HAYA TAG v*
  # =========================================================
  release:
    needs:
      - build-test
      - verificar-artifact

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # Recuperar exactamente los JAR producidos por build-test
      - name: Descargar JARs
        uses: actions/download-artifact@v4
        with:
          name: springboot-modulos
          path: ./ejecutables

      # Crear Release y adjuntar los tres JAR
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            ./ejecutables/**/*.jar \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes